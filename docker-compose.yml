# ==========================================
# AutoTrade Docker Compose
# ==========================================
# Production-ready multi-service setup

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: autotrade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: autotrade
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: autotrade
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotrade -d autotrade"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - autotrade-network

  # ==========================================
  # Redis Cache
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: autotrade-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - autotrade-network

  # ==========================================
  # Backend API (FastAPI)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autotrade-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: "postgresql+asyncpg://autotrade:${POSTGRES_PASSWORD}@db:5432/autotrade"
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      
      # JWT
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-your-production-secret-change-me}"
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      
      # Encryption (固定密钥, 防止 API key 解密失败)
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      
      # Trading
      TRADING_MODE: simulation
      SIMULATION_INITIAL_BALANCE: 100
      
      # Environment
      ENV_TYPE: production
      
      # News Module
      CRYPTOPANIC_API_KEY: "${CRYPTOPANIC_API_KEY:-}"
      
      # Memory (mem0 + LanceDB 向量化记忆)
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    volumes:
      - ./data_engine:/app/data_engine
      - ./backend/logs:/app/logs
      - ./backend/risk_config.yaml:/app/risk_config.yaml
      - risk_configs:/app/risk_configs
      - lancedb_data:/app/lancedb_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - autotrade-network

  # ==========================================
  # Frontend (Nginx + Vue)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: autotrade-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      WEB_ACCESS_USERNAME: "${WEB_ACCESS_USERNAME:-admin}"
      WEB_ACCESS_PASSWORD: "${WEB_ACCESS_PASSWORD:-AutoTrade2026}"
    ports:
      - "80:80"
    networks:
      - autotrade-network

  # ==========================================
  # Ollama (Local Embedding for mem0)
  # ==========================================
  ollama:
    image: ollama/ollama
    container_name: autotrade-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - autotrade-network

  # ==========================================
  # Data Spider (K-line Deep Backfill)
  # ==========================================
  spider:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autotrade-spider
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://autotrade:${POSTGRES_PASSWORD}@db:5432/autotrade"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data_engine:/app/data_engine
    command: ["python", "-m", "data_engine.binance_spider"]
    restart: "no"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; os.kill(1, 0)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - autotrade-network

# ==========================================
# Networks
# ==========================================
networks:
  autotrade-network:
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
  redis_data:
  risk_configs:
  lancedb_data:
  ollama_data:
