# ==========================================
# 🎛️ 老板风控配置中心
# ==========================================
# 修改后无需重启系统，每次下单自动读取最新值
# ==========================================

# --- 账户级防爆 ---
max_leverage: 20              # 最大杠杆倍数 (交易所限制 20x)
max_daily_loss_pct: 10.0      # 日最大亏损百分比 → 触发停止新开仓

# --- 仓位管理 ---
risk_percent: 10.0            # 每次下单使用可用余额的百分比
default_leverage: 5           # 策略未指定杠杆时的默认值
max_positions: 5              # 同时持有的最大仓位数
default_sl_pct: 2.0           # 默认止损百分比
default_tp_pct: 4.0           # 默认止盈百分比

# --- Kelly 模式 (高级) ---
kelly_fraction: 0.5           # Kelly 半仓比例 (1.0 = 全Kelly, 0.5 = 半Kelly)
max_risk_percent: 25.0        # 单笔最大资金比例 (Kelly 上限)

# --- 品种黑名单 ---
# 在下方添加禁止交易的品种，去掉 # 即可生效
blacklist: []
  # - DOGEUSDT
  # - SHIBUSDT
